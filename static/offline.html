<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>You are offline · RSS Reader</title>
		<style>
			:root {
				font-family: system-ui, sans-serif;
				color: #25211b;
				background: #f9f6f1;
			}
			body {
				margin: 0;
				min-height: 100svh;
				display: grid;
				place-items: center;
			}
			main {
				max-width: 28rem;
				padding: 2rem;
			}
			a {
				color: inherit;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color: #e8e4dd;
					background: #1d1a17;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>You are offline</h1>
			<p>Connect to the internet to read your feeds. Articles are not stored offline.</p>
			<p><a href="/">Try again</a></p>
		</main>
	</body>
</html>
